<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Strolly</title>
    <meta property="og:title" content="Strolly: Baby-Friendly Places">
    <meta property="og:description" content="Find cafés, restaurants and parks that actually welcome babies — changing tables, high chairs and stroller access, mapped by parents.">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #FFF9F5;
            color: #3C2A21;
            text-align: center;
        }
        .card {
            padding: 32px 24px;
            max-width: 380px;
        }
        .mascot { font-size: 56px; line-height: 1; }
        h1 { font-size: 24px; margin: 16px 0 4px; }
        p { color: #7A6A60; line-height: 1.5; margin: 0 0 24px; }
        a.btn {
            display: block;
            background: #E8734A;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 14px;
            margin-bottom: 10px;
        }
        a.btn.secondary { background: #fff; color: #E8734A; border: 1px solid #E8734A; }
        .hint { font-size: 13px; color: #A2938A; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mascot">🧸</div>
        <h1>Get Strolly</h1>
        <p>Baby-friendly places, mapped by parents.</p>

        <a class="btn" id="ios" href="https://apps.apple.com/app/id6745720318">Download for iPhone</a>
        <a class="btn secondary" id="android" href="https://play.google.com/store/apps/details?id=com.bimbobuddymobileapp">Download for Android</a>

        <p class="hint" id="hint">Taking you to your app store&hellip;</p>
    </div>

    <script>
        (function () {
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/.test(ua);

            // Desktop and anything we can't identify sees both buttons and no redirect,
            // so a shared link is never a dead end.
            if (!isIOS && !isAndroid) {
                document.getElementById('hint').textContent = 'Choose your device to install Strolly.';
                return;
            }

            var target = isIOS
                ? document.getElementById('ios').href
                : document.getElementById('android').href;

            // Replace rather than assign so the back button returns to wherever the
            // link was shared from, not to this interstitial.
            window.location.replace(target);
        })();
    </script>
</body>
</html>
